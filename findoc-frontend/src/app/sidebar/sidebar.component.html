<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">📄 FinDocGPT</div>
  </div>
  
  <div class="sidebar-section">
    <h3>System Metadata</h3>
    <div class="meta-item">
      <span class="label">LLM Engine:</span>
      <span class="value">{{ sessionModel }}</span>
    </div>
    <div class="meta-item">
      <span class="label">Vector DB:</span>
      <span class="value">{{ vectorDb }}</span>
    </div>
    <div class="meta-item" *ngIf="responseTime !== '0.00 s'">
      <span class="label">Latency:</span>
      <span class="value highlight">{{ responseTime }}</span>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="status-indicator">● RAG Pipeline Active</div>
  </div>
</aside>
